name: Veröffentlichen (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prüfen, ob sw.js aktuell ist
        run: |
          cp sw.js /tmp/sw.js
          python3 tools/build.py
          diff -q sw.js /tmp/sw.js || (echo "sw.js ist veraltet – bitte tools/build.py ausführen und committen" && exit 1)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
